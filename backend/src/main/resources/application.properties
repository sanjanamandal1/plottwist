spring.application.name=plottwist

# ── Database ─────────────────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/plottwist}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ── GitHub OAuth2 ────────────────────────────────────────────────────
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:Ov23li2jAE2eCpNHjcpp}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:your-client-secret}
spring.security.oauth2.client.registration.github.scope=read:user,repo

# ── OpenAI / Spring AI ──────────────────────────────────────────────
spring.ai.openai.api-key=${OPENAI_API_KEY:sk-placeholder}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-4o-mini}
spring.ai.openai.chat.options.temperature=0.3

# ── PgVector ─────────────────────────────────────────────────────────
spring.ai.vectorstore.pgvector.dimensions=1536
spring.ai.vectorstore.pgvector.index-type=hnsw
spring.ai.vectorstore.pgvector.distance-type=cosine_distance

# ── Encryption ───────────────────────────────────────────────────────
app.crypto.password=${CRYPTO_PASSWORD:change-me-in-production}
app.crypto.salt=${CRYPTO_SALT:abcdef0123456789}

# ── Frontend ─────────────────────────────────────────────────────────
app.frontend.url=${FRONTEND_URL:http://localhost:3000}
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000}

# ── Indexing ─────────────────────────────────────────────────────────
app.indexing.max-file-bytes=102400
app.indexing.chunk-size=1200
app.indexing.chunk-overlap=200

# ── RAG ──────────────────────────────────────────────────────────────
app.rag.similarity-top-k=8
app.rag.similarity-threshold=0.72
